<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - LIYU.ca</title>
    <link rel="stylesheet" href="css/admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>LIYU.ca</h1>
                <p>Admin Portal</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="admin@liyu.ca">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input">
                        <input type="password" id="password" name="password" required placeholder="Enter password">
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#forgot-password" class="link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <!-- MFA Form (hidden by default) -->
            <form id="mfa-form" class="auth-form" style="display: none;">
                <div class="mfa-header">
                    <i class="fas fa-shield-alt"></i>
                    <h3>Two-Factor Authentication</h3>
                    <p>Enter the 6-digit code from your authenticator app</p>
                </div>

                <div class="form-group">
                    <input type="text" id="mfa-code" name="mfa_code" required
                           placeholder="000000" maxlength="6" pattern="[0-9]{6}"
                           class="mfa-input">
                </div>

                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" name="trust-device">
                        <span>Trust this device for 30 days</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Verify & Continue
                </button>

                <button type="button" class="btn btn-secondary btn-block" onclick="backToLogin()">
                    Back to Login
                </button>
            </form>

            <div class="login-footer">
                <p>&copy; 2025 LIYU.ca. All rights reserved.</p>
                <div class="security-badges">
                    <i class="fas fa-lock"></i>
                    <span>Secured with 256-bit SSL encryption</span>
                </div>
            </div>
        </div>

        <!-- Security Notice -->
        <div class="security-notice">
            <i class="fas fa-info-circle"></i>
            <p>For security reasons, admin sessions expire after 30 minutes of inactivity.</p>
        </div>
    </div>

    <script src="js/admin-auth.js"></script>
</body>
</html>
